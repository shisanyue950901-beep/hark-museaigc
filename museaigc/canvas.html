<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>museaigc 画布</title>
<style>
  body{margin:0;font:13px system-ui,"Microsoft YaHei",sans-serif;background:#14161a;color:#ddd;display:flex;height:100vh}
  #bar{position:fixed;top:0;left:0;right:300px;height:40px;background:#1d2026;display:flex;gap:6px;align-items:center;padding:0 8px;z-index:5;border-bottom:1px solid #333}
  #bar button{background:#2c313a;color:#ddd;border:1px solid #444;border-radius:4px;padding:4px 8px;cursor:pointer}
  #msg{margin-left:auto;color:#e9b44c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
  #stage{position:relative;flex:1;overflow:hidden;margin-top:40px}
  #world{position:absolute;left:0;top:0;transform-origin:0 0}
  svg{position:absolute;left:0;top:0;width:6000px;height:4000px;overflow:visible}
  svg path{fill:none;stroke:#7a8699;stroke-width:2;pointer-events:stroke;cursor:pointer}
  svg path:hover{stroke:#e05555;stroke-width:4}
  .node{position:absolute;width:180px;background:#232730;border:2px solid #3a404c;border-radius:6px;user-select:none}
  .node.sel{border-color:#5aa0ff}
  .node .hd{padding:4px 6px;background:#2c313a;border-radius:4px 4px 0 0;cursor:move;display:flex;justify-content:space-between}
  .node .bd{padding:4px 6px;font-size:12px;color:#aaa}
  .node img,.node video{width:100%;display:block;margin-top:4px}
  .port{display:flex;align-items:center;gap:4px;margin:3px 0}
  .dot{width:11px;height:11px;border-radius:50%;background:#888;border:2px solid #14161a;cursor:crosshair}
  .in .dot{margin-left:-13px}.out{justify-content:flex-end}.out .dot{margin-right:-13px}
  .image{background:#4fb6a0}.video{background:#d08c3c}
  .st{font-size:11px;padding:0 4px;border-radius:3px}
  .DONE{background:#2f6b3a}.READY{background:#2d5a8c}.BLOCKED{background:#444}.WAITING_PICK,.WAITING_SEND{background:#7a5b1c}
  #side{width:300px;background:#1b1e23;border-left:1px solid #333;padding:8px;box-sizing:border-box;overflow:auto}
  #side textarea,#side input{width:100%;box-sizing:border-box;background:#111;color:#ddd;border:1px solid #444;font:12px monospace}
  #side textarea{height:220px}
  #side button{margin:4px 4px 0 0}
  pre{white-space:pre-wrap;font-size:11px;color:#9ab}
</style></head>
<body>
<div id="bar">
  <a href="/" style="color:#9cf;margin-right:8px">← 工程</a>
  <span>添加：</span>
  <span id="adders"></span>
  <button id="save">保存</button><button id="refresh">刷新状态</button>
  <span style="margin-left:10px">|</span>
  <button id="sb">分镜表</button><button id="bkf">批量出首帧</button><button id="bv">批量出视频</button><button id="brun">一键裁切拼接</button>
  <span style="margin-left:10px">|</span>
  <button id="dset">导演设定</button><button id="drev">导演通读</button>
  <span id="msg"></span>
</div>
<div id="stage"><div id="world"><svg id="wires"></svg></div></div>
<div id="sbm" style="display:none;position:fixed;inset:0;background:#000a;z-index:20">
  <div style="width:760px;margin:60px auto;background:#1d2026;border:1px solid #444;border-radius:8px;padding:16px">
    <b>分镜表</b> <small style="color:#889">每行：镜号 | 首帧画面 | 视频动作 | 成片秒数 | 接续（接 = 用上一镜尾帧；留空 = 重新出首帧）</small>
    <details style="margin-top:8px"><summary style="cursor:pointer;color:#9cf">AI 帮我写分镜（用接口里的对话模型，会消耗一次对话额度）</summary>
      <textarea id="story" style="width:100%;height:90px;margin-top:6px;background:#111;color:#ddd;border:1px solid #444" placeholder="写几句故事：深夜教室，杨间独自留下，手机屏幕忽明忽暗，走廊的灯一盏盏熄灭……"></textarea>
      镜头数 <input id="shots" type="number" min="1" max="30" value="5" style="width:60px"> <button id="draft">生成分镜表</button>
    </details>
    <textarea id="sbt" style="width:100%;height:260px;margin-top:8px;background:#111;color:#ddd;border:1px solid #444;font:13px monospace" placeholder="SH01 | 中近景，杨间低头看手机，夜间教室，冷蓝窗光配暖色台灯 | 镜头缓慢推近，约 2 秒处他抬眼 | 3 |
SH02 | （接续可不写画面） | 他缓缓转头看向窗外 | 3 | 接
SH03 | 全景，教室后排视角，杨间独坐窗边 | 固定机位，走廊灯依次熄灭 | 3 |"></textarea>
    <div style="margin-top:8px">画幅 <select id="sba"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:3</option></select>
      <small style="color:#889">首帧会连到画布上所有参考图节点（最多 4 个）</small></div>
    <div style="margin-top:10px"><button id="sbgo">展开到画布</button> <button id="sbx">取消</button> <span id="sbmsg" style="color:#e9b44c"></span></div>
  </div>
</div>
<div id="dm" style="display:none;position:fixed;inset:0;background:#000a;z-index:20">
  <div style="width:780px;margin:50px auto;background:#1d2026;border:1px solid #444;border-radius:8px;padding:16px;max-height:80vh;overflow:auto">
    <b id="dmt">导演</b>
    <div id="dmb" style="margin-top:8px"></div>
    <div style="margin-top:10px"><button id="dmok" style="display:none">保存</button> <button id="dmx">关闭</button> <span id="dmmsg" style="color:#e9b44c"></span></div>
  </div>
</div>
<div id="side"><b>选中节点</b><div id="panel"><p>点节点查看与编辑。拖动右侧圆点到另一节点左侧圆点即可连线；点连线删除。</p></div></div>
<script>
let G = null, SPEC = {}, STATUS = {}, OUTS = {}, sel = null, drag = null, wire = null;
let view = {x: 20, y: 20, k: 1};
const NAMES = {ref: '参考图', keyframe: '首帧', video: '视频', tailframe: '尾帧', trim: '裁切', concat: '拼接'};
const ST_NAMES = {DONE: '完成', READY: '可执行', BLOCKED: '等上游', WAITING_PICK: '待选首帧', WAITING_SEND: '待发送'};
const DEFAULTS = {trim: {in_s: 0, dur_s: 3}, tailframe: {from_end_s: 0.1},
  keyframe: {provider: 'muse-open', size: '16:9', prompt: ''},
  video: {provider: 'muse-open', aspect: '16:9', durationRequestSeconds: 5, sendAllowed: true, prompt: ''},
  concat: {width: 1920, height: 1080, fps: 24}};
const $ = (s) => document.querySelector(s);
const world = $('#world'), wires = $('#wires');
const msg = (t) => { $('#msg').textContent = t; };
const api = async (m, u, b) => { const r = await fetch(u, {method: m, headers: {'Content-Type': 'application/json'}, body: b ? JSON.stringify(b) : undefined}); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; };

async function load() {
  const j = await api('GET', '/api/graph'); G = j.graph; SPEC = j.spec;
  G.nodes ||= []; G.edges ||= [];
  $('#adders').innerHTML = Object.keys(SPEC).map(t => `<button data-add="${t}">${NAMES[t] || t}</button>`).join('');
  await refresh();
}
async function refresh() {
  const s = await api('GET', '/api/status'); STATUS = s.status; OUTS = s.outputs || {};
  msg(s.error ? '错误：' + s.error : (s.warnings || []).join('；') || '图有效');
  render();
}
function applyView() { world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; }
function render() {
  world.querySelectorAll('.node').forEach(n => n.remove());
  for (const n of G.nodes) {
    const sp = SPEC[n.type] || {in: {}, out: ''};
    const el = document.createElement('div');
    el.className = 'node' + (sel === n.id ? ' sel' : ''); el.dataset.id = n.id;
    el.style.left = (n.x || 0) + 'px'; el.style.top = (n.y || 0) + 'px';
    const st = STATUS[n.id] || '';
    const o = OUTS[n.id];
    let media = '';
    if (o) media = sp.out === 'image' ? `<img src="/files/${o.file}">` : `<video src="/files/${o.file}" muted controls></video>`;
    el.innerHTML = `<div class="hd"><span>${n.label || n.id}</span><span class="st ${st}">${ST_NAMES[st] || st}</span></div>
      <div class="bd">${n.type} · ${n.id}
      ${Object.entries(sp.in).map(([p, v]) => `<div class="port in" data-port="${p}"><span class="dot ${v[0]}"></span>${p} (${v[1]}–${v[2]})</div>`).join('')}
      <div class="port out"><span>${sp.out}</span><span class="dot ${sp.out}" data-out="1"></span></div>${media}</div>`;
    world.appendChild(el);
  }
  drawWires();
}
function portPos(id, port) {
  const el = world.querySelector(`.node[data-id="${CSS.escape(id)}"]`); if (!el) return null;
  const d = port ? el.querySelector(`.in[data-port="${port}"] .dot`) : el.querySelector('[data-out] ');
  const r = d.getBoundingClientRect(), w = world.getBoundingClientRect();
  return {x: (r.left + r.width / 2 - w.left) / view.k, y: (r.top + r.height / 2 - w.top) / view.k};
}
const curve = (a, b) => `M${a.x},${a.y} C${a.x + 60},${a.y} ${b.x - 60},${b.y} ${b.x},${b.y}`;
function drawWires(extra) {
  wires.innerHTML = '';
  G.edges.forEach((e, i) => {
    const a = portPos(e.from), b = portPos(e.to, e.port); if (!a || !b) return;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', curve(a, b)); p.dataset.i = i;
    p.onclick = () => { G.edges.splice(i, 1); drawWires(); msg('已删除连线（未保存）'); };
    wires.appendChild(p);
  });
  if (extra) { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', curve(extra.a, extra.b)); p.style.stroke = '#5aa0ff'; wires.appendChild(p); }
}
const toWorld = (ev) => { const w = world.getBoundingClientRect(); return {x: (ev.clientX - w.left) / view.k, y: (ev.clientY - w.top) / view.k}; };

world.addEventListener('mousedown', (ev) => {
  const nodeEl = ev.target.closest('.node');
  if (ev.target.dataset.out) { wire = {from: nodeEl.dataset.id}; ev.stopPropagation(); return; }
  if (nodeEl && ev.target.closest('.hd')) {
    const n = G.nodes.find(x => x.id === nodeEl.dataset.id), p = toWorld(ev);
    drag = {n, dx: p.x - (n.x || 0), dy: p.y - (n.y || 0)}; select(n.id); ev.stopPropagation(); return;
  }
  if (nodeEl) { select(nodeEl.dataset.id); ev.stopPropagation(); }
});
$('#stage').addEventListener('mousedown', (ev) => { if (!ev.target.closest('.node')) drag = {pan: true, sx: ev.clientX - view.x, sy: ev.clientY - view.y}; });
window.addEventListener('mousemove', (ev) => {
  if (wire) { drawWires({a: portPos(wire.from), b: toWorld(ev)}); return; }
  if (!drag) return;
  if (drag.pan) { view.x = ev.clientX - drag.sx; view.y = ev.clientY - drag.sy; applyView(); return; }
  const p = toWorld(ev); drag.n.x = Math.round(p.x - drag.dx); drag.n.y = Math.round(p.y - drag.dy);
  const el = world.querySelector(`.node[data-id="${CSS.escape(drag.n.id)}"]`); el.style.left = drag.n.x + 'px'; el.style.top = drag.n.y + 'px'; drawWires();
});
window.addEventListener('mouseup', (ev) => {
  if (wire) {
    const inp = ev.target.closest('.in'), nodeEl = ev.target.closest('.node');
    if (inp && nodeEl && nodeEl.dataset.id !== wire.from) { G.edges.push({from: wire.from, to: nodeEl.dataset.id, port: inp.dataset.port}); msg('已连线（未保存）'); }
    wire = null; drawWires();
  }
  drag = null;
});
$('#stage').addEventListener('wheel', (ev) => { ev.preventDefault(); view.k = Math.min(2, Math.max(0.3, view.k * (ev.deltaY < 0 ? 1.1 : 0.9))); applyView(); drawWires(); }, {passive: false});

function select(id) {
  sel = id; world.querySelectorAll('.node').forEach(e => e.classList.toggle('sel', e.dataset.id === id));
  const n = G.nodes.find(x => x.id === id); if (!n) return;
  $('#panel').innerHTML = `<p>${n.type} · <b>${n.id}</b> · ${ST_NAMES[STATUS[n.id]] || STATUS[n.id] || ''}</p>
    标签<input id="lbl" value="${(n.label || '').replace(/"/g, '&quot;')}">
    参数（JSON）<textarea id="prm">${JSON.stringify(n.params || {}, null, 2)}</textarea>
    <button id="apply">应用</button><button id="run">运行</button><button id="gen">生成</button><button id="brief">生成说明</button><button id="del">删除节点</button>
    ${n.type === 'ref' ? '<div style="margin:6px 0">上传参考图 <input type="file" id="upl" accept=".png,.jpg,.jpeg,.webp"></div>' : ''}
    ${n.type === 'keyframe' ? '<div style="margin:6px 0">或用已有图片作首帧 <input type="file" id="upl" accept=".png,.jpg,.jpeg,.webp"></div>' : ''}
    ${n.type === 'video' ? '<div style="margin:6px 0">或导入已有视频 <input type="file" id="upl" accept=".mp4,.mov,.webm"></div>' : ''}
    ${n.type === 'keyframe' || n.type === 'video' ? '提示词<textarea id="pt" style="height:90px">' + (n.params?.prompt || '').replace(/</g, '&lt;') + '</textarea>' : ''}
    ${n.type === 'keyframe' || n.type === 'video' ? '<div style="margin:6px 0;padding:6px;border:1px dashed #556"><input id="dask" placeholder="给导演的要求（可空），如：更压抑、改成仰拍"><button id="drv">让导演改提示词</button><div id="dsug"></div></div>' : ''}
    <div>选定文件（pick，相对图文件目录）<input id="pickf" placeholder="例如 frames/SH01_cand2.png"><button id="pick">pick</button></div>
    <div id="cands"></div><pre id="out"></pre>`;
  loadCands(n);
  if ($('#pt')) $('#pt').oninput = () => { n.params = {...(n.params || {}), prompt: $('#pt').value}; $('#prm').value = JSON.stringify(n.params, null, 2); };
  if ($('#upl')) $('#upl').onchange = async (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    try { await save();
      const r = await fetch('/api/upload/' + encodeURIComponent(n.id), {method: 'POST', headers: {'X-Filename': encodeURIComponent(f.name)}, body: f});
      const j = await r.json(); if (!r.ok) throw new Error(j.error);
      const g = await api('GET', '/api/graph'); G = g.graph; await refresh(); select(n.id); msg('已导入');
    } catch (e) { $('#out').textContent = e.message; }
  };
  $('#gen').onclick = async () => {
    try { await save();
      const again = ['重新生成', '再出一张'].includes($('#gen').textContent);
      const send = n.type === 'video' ? confirm((again ? '重新' : '') + '生成一次视频？会扣 50 分，结果不明时不会重发。') : false;
      if (n.type === 'video' && !send) return;
      if (n.type === 'keyframe' && again && !confirm('再出一张首帧？会再扣一次分（img2img 5 分）。')) return;
      await api('POST', '/api/gen/' + encodeURIComponent(n.id), {send, new: again});
      $('#out').textContent = '生成中…'; pollGen(n);
    } catch (e) { $('#out').textContent = e.message; }
  };
  if ($('#drv')) $('#drv').onclick = async () => {
    $('#dsug').textContent = '导演思考中…';
    try { await save();
      const r = await api('POST', '/api/director/revise/' + encodeURIComponent(n.id), {ask: $('#dask').value});
      $('#dsug').innerHTML = `<div style="margin-top:6px;white-space:pre-wrap;color:#cde">${esc(r.prompt)}</div>
        <ul style="margin:4px 0 4px 16px;color:#99a">${r.why.map(w => '<li>' + esc(w) + '</li>').join('')}</ul>
        <button id="duse">用这个</button>`;
      $('#duse').onclick = () => { n.params = {...(n.params || {}), prompt: r.prompt}; $('#pt').value = r.prompt;
        $('#prm').value = JSON.stringify(n.params, null, 2); save().then(() => msg('已换成导演的提示词')); };
    } catch (e) { $('#dsug').textContent = e.message; }
  };
  $('#apply').onclick = () => { try { n.label = $('#lbl').value; n.params = JSON.parse($('#prm').value); msg('已应用（未保存）'); render(); select(n.id); } catch (e) { msg('参数不是合法 JSON'); } };
  $('#del').onclick = () => { G.nodes = G.nodes.filter(x => x.id !== n.id); G.edges = G.edges.filter(e => e.from !== n.id && e.to !== n.id); sel = null; render(); msg('已删除（未保存）'); };
  $('#run').onclick = async () => { try { await save(); $('#out').textContent = JSON.stringify(await api('POST', '/api/run/' + encodeURIComponent(n.id)), null, 2); refresh(); } catch (e) { $('#out').textContent = e.message; } };
  $('#brief').onclick = async () => { $('#out').textContent = JSON.stringify(await api('GET', '/api/brief/' + encodeURIComponent(n.id)), null, 2); };
  $('#pick').onclick = async () => { try { await save(); $('#out').textContent = JSON.stringify(await api('POST', '/api/pick/' + encodeURIComponent(n.id), {file: $('#pickf').value}), null, 2); refresh(); } catch (e) { $('#out').textContent = e.message; } };
}
const STAGES = {uploading: '上传参考', generating: '生成中', downloading: '取回结果', queued: '排队', pending: '排队'};
async function loadCands(n) {
  const j = await api('GET', '/api/candidates/' + encodeURIComponent(n.id));
  $('#gen').disabled = !j.allowGenerate || !['keyframe', 'video'].includes(n.type);
  const t = j.task, running = j.job && j.job.state === 'running';
  if ($('#gen') && t && !running) {
    if (t.state === 'FAILED') $('#gen').textContent = '重新生成';
    else if (t.state === 'DONE' && n.type === 'keyframe') $('#gen').textContent = '再出一张';
  }
  let info = '';
  if (t) {
    info = `第 ${t.attempt} 次 · ${running ? (STAGES[t.stage] || STAGES[t.status] || '进行中') : ({DONE: '完成', FAILED: '失败', SUBMITTED: '已提交', SUBMITTING: '提交中'}[t.state] || t.state)}`
      + (t.cost_points != null ? ` · 扣 ${t.cost_points} 分` : '') + (t.width ? ` · ${t.width}×${t.height}` : '')
      + (t.state === 'FAILED' && t.error ? `<br><span style="color:#e88">${esc(t.error)}</span>` : '');
    if (running) info += ' <button id="cancel">取消</button>';
  }
  const ti = $('#taskinfo') || (() => { const d = document.createElement('div'); d.id = 'taskinfo'; d.style.cssText = 'margin:6px 0;color:#9ab;font-size:12px'; $('#cands').before(d); return d; })();
  ti.innerHTML = info;
  if ($('#cancel')) $('#cancel').onclick = async () => {
    if (!confirm('取消这个任务？排队中的会立即取消；正在生成的会在当前步骤结束后停下，不扣分。')) return;
    try { await api('POST', '/api/cancel/' + encodeURIComponent(n.id)); msg('已请求取消'); } catch (e) { msg(e.message); }
  };
  $('#cands').innerHTML = (j.candidates || []).map(c => `<div style="margin-top:6px"><img src="/files/${c.file}" style="width:100%"><button data-pick="${c.file}">选这张</button> <button data-rej="${c.file}">否掉</button> <small>${c.sha256.slice(0, 12)}</small></div>`).join('');
  $('#cands').querySelectorAll('[data-pick]').forEach(b => b.onclick = async () => {
    try { $('#out').textContent = JSON.stringify(await api('POST', '/api/pick/' + encodeURIComponent(n.id), {file: b.dataset.pick}), null, 2);
      const note = prompt('选它的理由？（可空，导演会记住你的口味）') || '';
      await api('POST', '/api/director/feedback', {node: n.id, verdict: 'pick', file: b.dataset.pick, note}).catch(() => {});
      refresh(); } catch (e) { $('#out').textContent = e.message; }
  });
  $('#cands').querySelectorAll('[data-rej]').forEach(b => b.onclick = async () => {
    const note = prompt('否掉的理由？（导演会记住）'); if (note === null) return;
    try { await api('POST', '/api/director/feedback', {node: n.id, verdict: 'reject', file: b.dataset.rej, note});
      b.textContent = '已否'; b.disabled = true; } catch (e) { $('#out').textContent = e.message; }
  });
  return j;
}
async function pollGen(n) {
  const j = await loadCands(n);
  if (j.job && j.job.state === 'running') { setTimeout(() => pollGen(n), 3000); return; }
  await refresh();
  if (sel === n.id) select(n.id);
  if (j.job) $('#out').textContent = j.job.state === 'error' ? '失败：' + j.job.error : (n.type === 'keyframe' ? '已出候选，点“选这张”' : '完成');
}
async function save() { const r = await api('PUT', '/api/graph', G); msg('已保存' + (r.warnings.length ? '；' + r.warnings.join('；') : '')); }
$('#save').onclick = () => save().then(refresh).catch(e => msg('未保存：' + e.message));
$('#refresh').onclick = refresh;
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
function dmOpen(title) { $('#dmt').textContent = title; $('#dmmsg').textContent = ''; $('#dm').style.display = 'block'; }
$('#dmx').onclick = () => { $('#dm').style.display = 'none'; };
$('#dset').onclick = async () => {
  dmOpen('导演设定（画风、还原、镜头规矩、禁止项；导演和 AI 分镜都按它来）');
  const j = await api('GET', '/api/director/profile');
  const fb = await api('GET', '/api/director/feedback');
  $('#dmb').innerHTML = `<textarea id="dprof" style="width:100%;height:340px;background:#111;color:#ddd;border:1px solid #444;font:13px monospace">${esc(j.text)}</textarea>
    <div style="margin-top:6px;color:#99a">已记住的取舍：${fb.items.length} 条（最近 20 条会交给导演参考）</div>`;
  $('#dmok').style.display = '';
  $('#dmok').onclick = async () => { try { await api('POST', '/api/director/profile', {text: $('#dprof').value}); $('#dmmsg').textContent = '已保存'; } catch (e) { $('#dmmsg').textContent = e.message; } };
};
$('#drev').onclick = async () => {
  dmOpen('导演通读全片提示词'); $('#dmok').style.display = 'none'; $('#dmb').textContent = '导演通读中…';
  try { await save(); const r = await api('POST', '/api/director/review');
    $('#dmb').innerHTML = `<p style="color:#cde">${esc(r.summary || '')}</p>` + (r.issues.length
      ? '<table style="width:100%;border-collapse:collapse">' + r.issues.map(i => `<tr style="border-top:1px solid #333"><td style="padding:4px;white-space:nowrap">${i.known ? `<a href="#" style="color:#9cf" data-go="${esc(i.node)}">${esc(i.node)}</a>` : esc(i.node || '')}</td><td style="padding:4px">${esc(i.problem || '')}</td><td style="padding:4px;color:#9c9">${esc(i.fix || '')}</td></tr>`).join('') + '</table>'
      : '<p>没发现问题。</p>');
    $('#dmb').querySelectorAll('[data-go]').forEach(a => a.onclick = (ev) => { ev.preventDefault(); $('#dm').style.display = 'none'; select(a.dataset.go); });
  } catch (e) { $('#dmb').textContent = e.message; }
};
$('#sb').onclick = () => { $('#sbm').style.display = 'block'; };
$('#draft').onclick = async () => {
  $('#sbmsg').textContent = '生成中…';
  try { const r = await api('POST', '/api/storyboard/draft', {story: $('#story').value, shots: +$('#shots').value || null});
    $('#sbt').value = r.text; $('#sbmsg').textContent = '已生成，检查修改后再展开';
  } catch (e) { $('#sbmsg').textContent = e.message; }
};
$('#sbx').onclick = () => { $('#sbm').style.display = 'none'; };
$('#sbgo').onclick = async () => {
  try { await save();
    const r = await api('POST', '/api/storyboard', {text: $('#sbt').value, aspect: $('#sba').value});
    const g = await api('GET', '/api/graph'); G = g.graph; await refresh();
    $('#sbm').style.display = 'none';
    msg(`已展开 ${r.added.length} 个节点，成片约 ${r.seconds} 秒` + (r.notes.length ? '；' + r.notes.join('；') : ''));
  } catch (e) { $('#sbmsg').textContent = e.message; }
};
async function batch(type) {
  try { await save();
    let confirmBox = false;
    if (type === 'video') {
      const n = Object.entries(STATUS).filter(([id, s]) => s === 'READY' && (G.nodes.find(x => x.id === id) || {}).type === 'video').length;
      if (!n) { msg('没有可生成的视频：先选定首帧'); return; }
      confirmBox = confirm(`批量生成 ${n} 段视频？会消耗 ${n} 次额度，结果不明时不会重发。`);
      if (!confirmBox) return;
    }
    const r = await api('POST', '/api/batch/gen', {type, confirm: confirmBox});
    msg(`已开始 ${r.started.length} 个` + (r.skipped.length ? `；跳过：${r.skipped.map(x => x.node + '（' + x.why + '）').join('、')}` : ''));
    pollBatch();
  } catch (e) { msg(e.message); }
}
let polling = false;
async function pollBatch() {
  if (polling) return; polling = true;
  try {
    for (;;) {
      const j = await api('GET', '/api/batch');
      const run = Object.values(j.jobs).filter(s => s === 'running').length;
      await refresh();
      const errs = Object.entries(j.jobs).filter(([k, s]) => s === 'error').map(([k]) => k);
      msg(run ? `生成中：${run} 个` : '生成结束' + (errs.length ? `；失败：${errs.join('、')}（点节点看原因）` : '；首帧请逐个点“选这张”'));
      if (!run) break;
      await new Promise(r => setTimeout(r, 3000));
    }
  } finally { polling = false; if (sel) select(sel); }
}
$('#bkf').onclick = () => batch('keyframe');
$('#bv').onclick = () => batch('video');
$('#brun').onclick = async () => {
  try { await save(); msg('裁切拼接中…');
    const r = await api('POST', '/api/batch/run');
    await refresh();
    msg(`完成 ${r.done.length} 个本机节点` + (r.errors.length ? `；出错：${r.errors.map(e => e.node + '：' + e.error).join('；')}` : '')
        + (r.warnings.length ? `；注意：${r.warnings.map(w => w.node + ' ' + w.warning).join('；')}` : ''));
  } catch (e) { msg(e.message); }
};
$('#adders').addEventListener('click', (ev) => {
  const t = ev.target.dataset.add; if (!t) return;
  let i = 1; while (G.nodes.some(n => n.id === `${t}${i}`)) i++;
  G.nodes.push({id: `${t}${i}`, type: t, label: `${t}${i}`, x: 60 - view.x, y: 60 - view.y, params: DEFAULTS[t] ? JSON.parse(JSON.stringify(DEFAULTS[t])) : {}});
  render(); select(`${t}${i}`); msg('已添加（未保存）');
});
applyView(); load().catch(e => msg(e.message));
</script>
</body></html>
